# Torch naive PP trainer config
defaults:
  - actor@actor_rollout_ref.actor: torch_pp_actor
  - data@data: legacy_data
  - ref@actor_rollout_ref.ref: dp_ref
  - rollout@actor_rollout_ref.rollout: rollout
  - critic@critic: dp_critic
  - reward_model@reward_model: dp_reward_model
  - _self_

actor_rollout_ref:
  hybrid_engine: True

  nccl_timeout: 600

  # Profiling
  enable_pp_trace: false
  enable_response_profiling: true
  profiling_save_dir: null

  model:
    path: ~/models/Qwen3-0.6B
    custom_chat_template: null
    external_lib: null
    override_config:
      model_config: {}
      moe_config:
        freeze_moe_router: False
    use_fused_kernels: False
    trust_remote_code: False
    use_remove_padding: false

  rollout:
    tp_groups: null  # e.g. [[0,1],[2],[3]] for heterogeneous TP
    routing_strategy: round_robin  # round_robin | random | length | prompt_length | response_length | weighted_response_length
    routing_warmup_epochs: 1
    routing_prompt_coef: 1.0
    routing_response_coef: 4.0
    routing_default_response_length: 1024.0
    routing_history_estimator: mean  # latest | mean | ema
    routing_ema_alpha: 0.5
    routing_response_agg: max  # mean | max | p80 | p90 | ...
    routing_group_weights: null  # defaults to TP sizes when tp_groups is set
    routing_random_seed: 0
    layer_name_map:
      qkv_layer_name: qkv
      gate_proj_layer_name: gate_up

custom_reward_function:
  path: null
  name: compute_score

algorithm:
  _target_: verl.trainer.config.AlgoConfig
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    _target_: verl.trainer.config.KLControlConfig
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: False
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0
  rollout_is_threshold: null
  rollout_is_threshold_lower: null
  rollout_is_level: token
  rollout_is_mode: truncate
  rollout_is_veto_threshold: 1e-4
  rollout_is: false

trainer:
  balance_batch: False
  total_epochs: 10
  total_training_steps: null
  project_name: verl_torch_pp
  experiment_name: torch_pp_grpo
  logger: ["console", "wandb"]
  log_val_generations: 0
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: -1
  esi_redundant_time: 0
  resume_mode: auto
  resume_from_path: null
  del_local_ckpt_after_load: False
  val_before_train: True
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 300
  device: cuda
  rollout_data_dir: null

global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  steps: null
  profile_continuous_steps: False
  save_path: "outputs/profile"
  global_tool_config:
    nsys:
      discrete: False
      controller_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"
        cuda-memory-usage: "true"
        cuda-graph-trace: "graph"
      worker_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"
        cuda-memory-usage: "true"
        cuda-graph-trace: "graph"
        capture-range: "cudaProfilerApi"
        capture-range-end: null
        kill: none
    torch_memory:
      trace_alloc_max_entries: 100_000
      stack_depth: 32
      context: "all"
      stacks: "all"
      kw_args: {}

transfer_queue:
  enable: False

ray_kwargs:
  ray_init:
    num_cpus: null
  timeline_json_file: null
